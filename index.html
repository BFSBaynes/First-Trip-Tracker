<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-Trip Completion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#14213D;--muted:#4A5568;--line:#DDE2EC;--soft:#E7EBF3;--bg:#F4F6FA;--blue:#1E40AF;--orange:#C2410C;--amber:#F59E0B;--navy2:#22325A}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,select,input{font-family:inherit;font-size:14px;color:var(--ink)}
button{cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.top{background:var(--ink);color:#fff}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-top:16px;padding-bottom:16px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.01em}
.seg{display:flex;gap:4px;background:var(--navy2);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;color:#D5DCEE;font-weight:600;padding:8px 16px;border-radius:7px;min-height:36px}
.seg button.on{background:#fff;color:var(--ink);font-weight:700}
.nav{display:flex;gap:4px}
.nav button{border:0;background:transparent;color:#D5DCEE;font-weight:600;padding:8px 14px;border-radius:7px;min-height:44px}
.nav button.on{background:var(--navy2);color:#fff;font-weight:700}
.spacer{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #5A6C98;background:transparent;color:#fff;font-weight:600;padding:10px 16px;border-radius:8px;min-height:44px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:800}
.btn.light{background:#fff;border-color:#C3CBDA;color:var(--ink)}
.btn:hover{filter:brightness(.95)}
main{padding:20px 0 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:16px 20px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fld select,.fld input{min-height:44px;border:1px solid #C3CBDA;border-radius:8px;padding:0 12px;background:#fff;max-width:100%}
.hide-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600}
.chk input{width:20px;height:20px}
.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:700;text-decoration:underline;min-height:44px;padding:0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.kpi .k{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.kpi .v.sm{font-size:26px;line-height:1.25;margin-top:12px}
.kpi .s{font-size:13px;color:var(--muted);margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px}
.col3{flex:3 1 520px;min-width:0}.col2{flex:2 1 360px;min-width:0}
h2{font-size:17px;font-weight:800;margin:0}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.plot{position:relative;height:200px;margin-top:18px;display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid #C3CBDA}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--amber)}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.mrate{font-size:12px;font-weight:800}
.mbar{width:100%;max-width:64px;border-radius:6px 6px 0 0}
.mlabels{display:flex;gap:16px;margin-top:8px}
.mlabels div{flex:1 1 0;min-width:0;text-align:center;font-size:13px;font-weight:700}
.mlabels span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.track{height:10px;background:var(--soft);border-radius:6px}
.fillbar{height:10px;border-radius:6px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;font-weight:700;white-space:nowrap}
th button{border:0;background:transparent;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:700;padding:0;min-height:32px}
td{padding:11px 8px;border-top:1px solid var(--soft);vertical-align:top}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 12px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid}
.pill.c{background:#E8EEFC;color:var(--blue)}.pill.i{background:#FDEBDD;color:#9A3412}
.flag{font-size:12px;font-weight:700;color:var(--orange)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.chip{min-height:44px;border:1px solid #C3CBDA;background:#fff;font-weight:600;padding:0 16px;border-radius:22px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 12px}
details.cols{position:relative}
details.cols summary{list-style:none;min-height:44px;display:inline-flex;align-items:center;border:1px solid #C3CBDA;border-radius:8px;padding:0 16px;background:#fff;font-weight:600;cursor:pointer}
details.cols summary::-webkit-details-marker{display:none}
details.cols .pop{position:absolute;right:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(20,33,61,.15);min-width:180px}
.empty{text-align:center;padding:48px 20px}
.drop{border:2px dashed #9AA7C4;border-radius:14px;padding:44px 20px;text-align:center;background:#fff}
.drop h1{font-size:24px;margin:0 0 8px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.printonly{display:none}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:36px}}
@media print{
 body{background:#fff}
 .noprint{display:none!important}
 .printonly{display:block!important;margin-bottom:12px}
 .card{break-inside:avoid;border-color:#ccc}
 .wrap{max-width:none;padding:0}
 main{padding:0}
 .scroll{overflow:visible}
}
</style>
</head>
<body>

<header class="top noprint">
 <div class="wrap bar">
  <div class="brand">First-Trip Completion</div>
  <div class="seg" id="dsSeg">
   <button data-act="ds" data-v="trim">Trim</button>
   <button data-act="ds" data-v="lockout">Lockout</button>
  </div>
  <div class="nav" id="viewNav">
   <button data-act="view" data-v="dash">Dashboard</button>
   <button data-act="view" data-v="log">Job log</button>
  </div>
  <div class="spacer"></div>
  <label class="btn" for="file">Load file</label>
  <input type="file" id="file" hidden accept=".xlsx,.xlsm,.xls">
  <button class="btn" data-act="xlsx">Export Excel</button>
  <button class="btn" data-act="png">Save as image</button>
  <button class="btn primary" data-act="pdf">Export PDF</button>
 </div>
</header>

<main class="wrap">
 <div id="filters" class="card filters noprint" hidden></div>
 <div id="report">
  <div class="printonly" id="printHead"></div>
  <div id="body"></div>
 </div>
 <div class="note noprint" style="margin-top:18px">Your file is read in this browser only. Nothing is uploaded or saved.</div>
</main>

<script>
'use strict';
var ROSTER=['Greg Watson','Jared Gay','David Englert','Braden Jeane'];
var COLS=[['date','Date'],['builder','Builder'],['community','Community'],['lot','Lot'],['aw','AppWright #'],['pm','PM'],['result','Result'],['reason','Reason'],['notes','Notes'],['flags','Flags']];
var S={data:{trim:[],lockout:[]},maps:{trim:null,lockout:null},pmSince:{trim:null,lockout:null},ds:'trim',view:'dash',loaded:false,
 f:{from:'',to:'',builder:'',pm:'',community:'',reason:'',q:''},
 hide:{builder:false,community:false,pm:false},
 quick:{inc:false,repeat:false,roc:false,nopm:false,flag:false},
 cols:{date:true,builder:true,community:true,lot:true,aw:true,pm:true,result:true,reason:true,notes:false,flags:true},
 colsOpen:false,sort:{key:'date',dir:-1},limit:100,showAllB:false,goal:90};
try{var g=parseFloat(localStorage.getItem('ftc_goal'));if(g>0&&g<=100)S.goal=g;}catch(e){}

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function fmtPct(v){return v==null?'\u2013':v.toFixed(1)+'%'}
function stats(rows){var c=0,i=0;rows.forEach(function(r){if(r.result==='Complete')c++;else i++});return{n:rows.length,c:c,i:i,rate:rows.length?c/rows.length*100:null}}
function pad(n){return n<10?'0'+n:''+n}

/* ---------- reading the workbook ---------- */
function toDate(v){
 if(v instanceof Date)return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()));
 if(typeof v==='number')return new Date(Math.round((Math.floor(v)-25569)*864e5));
 if(typeof v==='string'&&v.trim()){var t=Date.parse(v);if(!isNaN(t)){var d=new Date(t);return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))}}
 return null;
}
function cleanStr(v){return v==null?'':String(v).trim()}
function parseSheet(ws){
 var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 var hi=-1;
 for(var i=0;i<Math.min(rows.length,15);i++){
  var r=rows[i]||[];
  var hasRes=r.some(function(c){return typeof c==='string'&&/^result$/i.test(c.trim())});
  var hasB=r.some(function(c){return typeof c==='string'&&/builder/i.test(c)});
  if(hasRes&&hasB){hi=i;break}
 }
 if(hi<0)return[];
 var H=rows[hi].map(function(c){return cleanStr(c).toLowerCase()});
 function ix(fn){return H.findIndex(fn)}
 var c={date:ix(function(h){return h==='date'}),builder:ix(function(h){return h==='builder'}),community:ix(function(h){return h.indexOf('community')===0}),
  lot:ix(function(h){return h.indexOf('lot')===0}),aw:ix(function(h){return h.indexOf('appwright')>=0}),result:ix(function(h){return h==='result'}),
  reason:ix(function(h){return h==='reason'}),notes:ix(function(h){return h==='notes'}),pm:ix(function(h){return h.indexOf('project manager')>=0||h==='pm'})};
 function get(r,k){return c[k]>=0?r[c[k]]:null}
 var out=[];
 for(var j=hi+1;j<rows.length;j++){
  var r=rows[j];if(!r)continue;
  var d=toDate(get(r,'date')),b=cleanStr(get(r,'builder')),res=cleanStr(get(r,'result'));
  if(!d||!b||!res)continue;
  var result=/^complete/i.test(res)?'Complete':/^incomplete/i.test(res)?'Incomplete':null;
  if(!result)continue;
  var pm=cleanStr(get(r,'pm'));
  for(var k=0;k<ROSTER.length;k++){if(ROSTER[k].toLowerCase()===pm.toLowerCase())pm=ROSTER[k]}
  var ymd=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
  out.push({ymd:ymd,ym:ymd.slice(0,7),ds:pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate())+'/'+d.getUTCFullYear(),dow:d.getUTCDay(),
   builder:b,community:cleanStr(get(r,'community')),lot:cleanStr(get(r,'lot')),aw:cleanStr(get(r,'aw')),
   result:result,reason:cleanStr(get(r,'reason')),notes:cleanStr(get(r,'notes')),pm:pm,flags:[],idx:j});
 }
 return out;
}
function finish(rows,key){
 var cnt={};rows.forEach(function(r){if(r.aw)cnt[r.aw]=(cnt[r.aw]||0)+1});
 var since=null;rows.forEach(function(r){if(r.pm&&(!since||r.ymd<since))since=r.ymd});
 S.pmSince[key]=since;
 rows.forEach(function(r){
  r.repeat=!!(r.aw&&cnt[r.aw]>1);r.roc=(r.result==='Complete'&&!!r.reason);r.nopm=!r.pm;
  if(r.repeat)r.flags.push('Repeat #');
  if(r.roc)r.flags.push('Reason on Complete');
  if(since&&r.ymd>=since&&!r.pm)r.flags.push('No PM');
  if(r.dow===0||r.dow===6)r.flags.push('Weekend date');
 });
 function ranked(k){var o={};rows.forEach(function(r){if(r[k])o[r[k]]=(o[r[k]]||0)+1});return Object.keys(o).sort(function(a,b){return o[b]-o[a]})}
 var bm={},cm={},pm={};
 ranked('builder').forEach(function(b,i){bm[b]='Builder '+(i<26?String.fromCharCode(65+i):i+1)});
 ranked('community').forEach(function(c,i){cm[c]='Community '+(i+1)});
 ROSTER.concat(ranked('pm').filter(function(p){return ROSTER.indexOf(p)<0})).forEach(function(p,i){pm[p]='PM '+(i+1)});
 S.maps[key]={builder:bm,community:cm,pm:pm};
}
function loadWorkbook(buf){
 var wb=XLSX.read(buf,{type:'array'});
 var found={trim:null,lockout:null};
 wb.SheetNames.forEach(function(n){var l=n.toLowerCase();if(l.indexOf('log')<0)return;if(l.indexOf('trim')>=0)found.trim=n;if(l.indexOf('lockout')>=0)found.lockout=n});
 S.data.trim=found.trim?parseSheet(wb.Sheets[found.trim]):[];
 S.data.lockout=found.lockout?parseSheet(wb.Sheets[found.lockout]):[];
 if(!S.data.trim.length&&!S.data.lockout.length){alert('Could not find a Trim Log or Lockout Log sheet with Builder and Result columns.\nSheets in this file: '+wb.SheetNames.join(', '));return}
 finish(S.data.trim,'trim');finish(S.data.lockout,'lockout');
 S.loaded=true;S.ds=S.data.trim.length?'trim':'lockout';
 resetFilters();draw();
}

/* ---------- names, filters ---------- */
function nm(kind,v){if(!v)return'';if(!S.hide[kind])return v;return S.maps[S.ds][kind][v]||'Hidden'}
function rowsNow(){return S.data[S.ds]}
function resetFilters(){
 var rows=rowsNow();var mn='',mx='';
 rows.forEach(function(r){if(!mn||r.ymd<mn)mn=r.ymd;if(!mx||r.ymd>mx)mx=r.ymd});
 S.f={from:mn,to:mx,builder:'',pm:'',community:'',reason:'',q:''};
 S.quick={inc:false,repeat:false,roc:false,nopm:false,flag:false};S.limit=100;
}
function filt(rows,withQuick){
 var f=S.f,q=f.q.trim().toLowerCase(),k=S.quick;
 return rows.filter(function(r){
  if(f.from&&r.ymd<f.from)return false;if(f.to&&r.ymd>f.to)return false;
  if(f.builder&&r.builder!==f.builder)return false;if(f.pm&&r.pm!==f.pm)return false;
  if(f.community&&r.community!==f.community)return false;if(f.reason&&r.reason!==f.reason)return false;
  if(q){var hay=[r.builder,r.community,r.lot,r.aw,r.reason,r.notes,r.pm].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false}
  if(withQuick){
   if(k.inc&&r.result!=='Incomplete')return false;if(k.repeat&&!r.repeat)return false;if(k.roc&&!r.roc)return false;
   if(k.nopm&&!r.nopm)return false;if(k.flag&&!r.flags.length)return false;
  }
  return true;
 });
}
function uniq(rows,k){var o={};rows.forEach(function(r){if(r[k])o[r[k]]=1});return Object.keys(o)}
function options(kind,field,all,sel){
 var vals=uniq(rowsNow(),field);
 if(field==='pm')vals=ROSTER.filter(function(p){return vals.indexOf(p)>=0}).concat(vals.filter(function(p){return ROSTER.indexOf(p)<0}));
 else vals.sort(function(a,b){return nm(kind,a).localeCompare(nm(kind,b))});
 return '<option value="">'+all+'</option>'+vals.map(function(v){return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(kind?nm(kind,v):v)+'</option>'}).join('');
}
function drawFilters(){
 var el=$('#filters');el.hidden=!S.loaded;if(!S.loaded)return;
 var f=S.f;
 el.innerHTML=
 '<div class="fld"><label for="f-from">From</label><input type="date" id="f-from" data-f="from" value="'+f.from+'"></div>'+
 '<div class="fld"><label for="f-to">To</label><input type="date" id="f-to" data-f="to" value="'+f.to+'"></div>'+
 '<div class="fld"><label for="f-builder">Builder</label><select id="f-builder" data-f="builder">'+options('builder','builder','All builders',f.builder)+'</select></div>'+
 '<div class="fld"><label for="f-pm">Project manager</label><select id="f-pm" data-f="pm">'+options('pm','pm','All PMs',f.pm)+'</select></div>'+
 '<div class="fld"><label for="f-community">Community</label><select id="f-community" data-f="community">'+options('community','community','All communities',f.community)+'</select></div>'+
 '<div class="fld"><label for="f-reason">Reason</label><select id="f-reason" data-f="reason">'+options('','reason','All reasons',f.reason)+'</select></div>'+
 '<div class="fld" style="flex:1 1 180px"><label for="f-q">Search</label><input type="text" id="f-q" data-f="q" placeholder="AppWright #, lot, notes" value="'+esc(f.q)+'"></div>'+
 '<button class="linkbtn" data-act="clear">Clear filters</button>'+
 '<div style="flex:1 1 100%;border-top:1px solid var(--soft);padding-top:8px"><div class="hide-box"><span class="lbl">Hide for sharing</span>'+
 '<label class="chk"><input type="checkbox" data-hide="builder"'+(S.hide.builder?' checked':'')+'>Builder names</label>'+
 '<label class="chk"><input type="checkbox" data-hide="community"'+(S.hide.community?' checked':'')+'>Communities</label>'+
 '<label class="chk"><input type="checkbox" data-hide="pm"'+(S.hide.pm?' checked':'')+'>PM names</label></div></div>';
}

/* ---------- dashboard ---------- */
function groupBy(rows,key){var o={};rows.forEach(function(r){var k=r[key]||'';(o[k]=o[k]||[]).push(r)});return o}
function monthLabel(ym,multi){
 var y=+ym.slice(0,4),m=+ym.slice(5,7);
 var s=new Date(Date.UTC(y,m-1,1)).toLocaleString('en-US',{month:'short',timeZone:'UTC'});
 return multi?s+' '+String(y).slice(2):s;
}
function barColor(rate){return rate>=S.goal?'var(--blue)':'var(--orange)'}
function renderDash(){
 var rows=filt(rowsNow(),false),st=stats(rows);
 if(!rows.length)return '<div class="card empty">No jobs match these filters.</div>';
 var inc=rows.filter(function(r){return r.result==='Incomplete'}),rc={};
 inc.forEach(function(r){var k=r.reason||'(No reason entered)';rc[k]=(rc[k]||0)+1});
 var reasons=Object.keys(rc).map(function(k){return[k,rc[k]]}).sort(function(a,b){return b[1]-a[1]});
 var maxR=reasons.length?reasons[0][1]:1;
 var mm=groupBy(rows,'ym'),keys=Object.keys(mm).sort();
 var multi=Object.keys(groupBy(keys.map(function(k){return{y:k.slice(0,4)}}),'y')).length>1;
 var maxYmd=rows.reduce(function(a,r){return r.ymd>a?r.ymd:a},'');
 var lastKey=keys[keys.length-1],eom=new Date(Date.UTC(+lastKey.slice(0,4),+lastKey.slice(5,7),0)).getUTCDate();
 var partial=maxYmd.slice(0,7)===lastKey&&+maxYmd.slice(8,10)<eom;
 var plot='',labs='';
 keys.forEach(function(k){
  var s=stats(mm[k]);
  plot+='<div class="mcol"><div class="mrate">'+fmtPct(s.rate)+'</div><div class="mbar" style="height:'+Math.round(s.rate*1.5)+'px;background:'+barColor(s.rate)+'"></div></div>';
  labs+='<div>'+monthLabel(k,multi)+'<span>'+s.n+' jobs</span></div>';
 });
 var bg=groupBy(rows,'builder'),bnames=Object.keys(bg).sort(function(a,b){return bg[b].length-bg[a].length});
 var shownB=S.showAllB?bnames:bnames.slice(0,10);
 var btab=shownB.map(function(b){
  var s=stats(bg[b]);
  return '<tr><td style="font-weight:700">'+esc(nm('builder',b))+'</td><td style="text-align:right">'+s.n+'</td><td style="text-align:right">'+s.i+'</td>'+
  '<td style="min-width:200px"><div style="display:flex;align-items:center;gap:10px"><div class="track" style="flex:1 1 0"><div class="fillbar" style="width:'+Math.round(s.rate)+'%;background:'+barColor(s.rate)+'"></div></div>'+
  '<span style="width:52px;text-align:right;font-weight:800">'+fmtPct(s.rate)+'</span><span class="flag" style="width:64px">'+(s.rate<S.goal?'Below goal':'')+'</span></div></td></tr>';
 }).join('');
 var moreB=bnames.length>10?'<button class="linkbtn" data-act="allb">'+(S.showAllB?'Show top 10 only':'Show all '+bnames.length+' builders')+'</button>':'';
 var pg=groupBy(rows,'pm');
 var pnames=ROSTER.filter(function(p){return true}).concat(Object.keys(pg).filter(function(p){return p&&ROSTER.indexOf(p)<0}));
 var ptab=pnames.map(function(p){
  var arr=pg[p]||[],s=stats(arr);
  return '<tr><td style="font-weight:700">'+esc(nm('pm',p))+'</td><td style="text-align:right">'+(s.n||'\u2013')+'</td><td style="text-align:right">'+(s.n?s.i:'\u2013')+'</td><td style="text-align:right;font-weight:800;color:'+(s.n?(s.rate>=S.goal?'var(--blue)':'var(--orange)'):'var(--muted)')+'">'+fmtPct(s.rate)+'</td></tr>';
 }).join('');
 var nop=pg[''];
 if(nop&&nop.length){var s0=stats(nop);ptab+='<tr><td style="color:var(--muted)">No PM name</td><td style="text-align:right">'+s0.n+'</td><td style="text-align:right">'+s0.i+'</td><td style="text-align:right;color:var(--muted)">'+fmtPct(s0.rate)+'</td></tr>'}
 var span=S.f.from&&S.f.to?(S.f.from+' to '+S.f.to):'';
 return ''+
 '<div class="kpis">'+
 '<div class="card kpi"><div class="k">First-trip rate</div><div class="v" style="color:'+barColor(st.rate)+'">'+fmtPct(st.rate)+'</div><div class="s">'+st.c+' of '+st.n+' jobs complete</div></div>'+
 '<div class="card kpi"><div class="k">Total jobs</div><div class="v">'+st.n+'</div><div class="s">'+esc(span)+'</div></div>'+
 '<div class="card kpi"><div class="k">Incomplete</div><div class="v" style="color:var(--orange)">'+st.i+'</div><div class="s">jobs needing a second trip</div></div>'+
 '<div class="card kpi"><div class="k">Top reason</div><div class="v sm">'+(reasons.length?esc(reasons[0][0]):'\u2013')+'</div><div class="s">'+(reasons.length?reasons[0][1]+' of '+st.i+' incomplete jobs':'No incomplete jobs')+'</div></div>'+
 '</div>'+
 '<div class="row"><div class="card col3"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h2>Completion rate by month</h2>'+
 '<div class="sub noprint" style="margin:0">Goal <input type="number" id="goal" min="1" max="100" value="'+S.goal+'" style="width:64px;min-height:36px;border:1px solid #C3CBDA;border-radius:8px;padding:0 8px">% <span style="color:var(--amber);font-weight:800">- - -</span></div>'+
 '<div class="sub printonly" style="margin:0">Dashed line = goal ('+S.goal+'%)</div></div>'+
 '<div class="plot"><div class="goalline" style="bottom:'+Math.round(S.goal*1.5)+'px"></div>'+plot+'</div><div class="mlabels">'+labs+'</div>'+
 (partial?'<div class="note">The latest month is not finished yet.</div>':'')+'</div>'+
 '<div class="card col2"><h2>Why trips were incomplete</h2><div class="sub">'+st.i+' incomplete jobs, by reason</div><div style="display:flex;flex-direction:column;gap:14px;margin-top:18px">'+
 (reasons.length?reasons.map(function(r){return '<div><div style="display:flex;justify-content:space-between;font-weight:600"><span>'+esc(r[0])+'</span><span style="font-weight:800">'+r[1]+'</span></div><div class="track" style="margin-top:6px"><div class="fillbar" style="width:'+Math.round(r[1]/maxR*100)+'%;background:var(--orange)"></div></div></div>'}).join(''):'<div class="sub">Nothing to show.</div>')+
 '</div></div></div>'+
 '<div class="row"><div class="card col3"><h2>By builder</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Builder</th><th style="text-align:right">Jobs</th><th style="text-align:right">Incomplete</th><th>First-trip rate</th></tr></thead><tbody>'+btab+'</tbody></table></div>'+moreB+'</div>'+
 '<div class="card col2"><h2>By project manager</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>PM</th><th style="text-align:right">Jobs</th><th style="text-align:right">Incomplete</th><th style="text-align:right">Rate</th></tr></thead><tbody>'+ptab+'</tbody></table></div>'+
 '<div class="note">Jobs entered before PM names were added show as No PM name.</div></div></div>';
}

/* ---------- job log ---------- */
function sortedRows(){
 var rows=filt(rowsNow(),true).slice(),k=S.sort.key,d=S.sort.dir;
 function val(r){
  if(k==='date')return r.ymd;if(k==='lot'||k==='aw'){var n=parseFloat(r[k]);return isNaN(n)?-1:n}
  if(k==='flags')return r.flags.length;return String(r[k]||'').toLowerCase();
 }
 rows.sort(function(a,b){var x=val(a),y=val(b);if(x<y)return-1*d;if(x>y)return 1*d;return b.idx-a.idx});
 return rows;
}
function cell(k,r){
 if(k==='date')return esc(r.ds);if(k==='builder')return '<b>'+esc(nm('builder',r.builder))+'</b>';if(k==='community')return esc(nm('community',r.community));
 if(k==='lot')return esc(r.lot);if(k==='aw')return esc(r.aw);if(k==='pm')return r.pm?esc(nm('pm',r.pm)):'<span style="color:var(--muted)">\u2013</span>';
 if(k==='result')return '<span class="pill '+(r.result==='Complete'?'c':'i')+'">'+r.result+'</span>';
 if(k==='reason')return r.reason?esc(r.reason):'\u2013';if(k==='notes')return esc(r.notes);
 if(k==='flags')return '<span class="flag">'+esc(r.flags.join(' \u00b7 '))+'</span>';return '';
}
function renderLog(){
 var rows=sortedRows(),total=rowsNow().length,q=S.quick;
 var vis=COLS.filter(function(c){return S.cols[c[0]]});
 var chips=[['inc','Incomplete only'],['repeat','Repeat AppWright #'],['flag','Needs a look'],['roc','Reason on a Complete job'],['nopm','No PM name']].map(function(c){return '<button class="chip'+(q[c[0]]?' on':'')+'" data-act="quick" data-v="'+c[0]+'">'+c[1]+'</button>'}).join('');
 var head=vis.map(function(c){var arrow=S.sort.key===c[0]?(S.sort.dir>0?' \u25b2':' \u25bc'):'';return '<th><button data-act="sort" data-v="'+c[0]+'">'+c[1]+arrow+'</button></th>'}).join('');
 var shown=rows.slice(0,S.limit);
 var body=shown.map(function(r){return '<tr>'+vis.map(function(c){return '<td>'+cell(c[0],r)+'</td>'}).join('')+'</tr>'}).join('');
 var more=rows.length>S.limit?'<div style="text-align:center;margin-top:12px" class="noprint"><button class="btn light" data-act="more">Show 100 more ('+(rows.length-S.limit)+' left)</button></div>':'';
 return ''+
 '<div class="card noprint"><span class="lbl">Quick filters</span><div class="chips" style="margin-top:8px">'+chips+'</div></div>'+
 '<div class="tools"><div>Showing '+Math.min(S.limit,rows.length)+' of '+rows.length+' jobs'+(rows.length!==total?' (filtered from '+total+')':'')+'</div>'+
 '<details class="cols noprint"'+(S.colsOpen?' open':'')+'><summary>Columns</summary><div class="pop">'+COLS.map(function(c){return '<label class="chk"><input type="checkbox" data-col="'+c[0]+'"'+(S.cols[c[0]]?' checked':'')+'>'+c[1]+'</label>'}).join('')+'</div></details></div>'+
 '<div class="card" style="padding:8px 16px 16px"><div class="scroll"><table style="min-width:'+Math.max(520,vis.length*110)+'px"><thead><tr>'+head+'</tr></thead><tbody>'+(body||'<tr><td colspan="'+vis.length+'" style="text-align:center;padding:32px">No jobs match these filters.</td></tr>')+'</tbody></table></div>'+more+'</div>';
}

/* ---------- drawing ---------- */
function printHead(){
 var parts=[];var f=S.f;
 if(f.from&&f.to)parts.push(f.from+' to '+f.to);
 if(f.builder)parts.push(nm('builder',f.builder));if(f.pm)parts.push(nm('pm',f.pm));if(f.community)parts.push(nm('community',f.community));if(f.reason)parts.push(f.reason);
 return '<div style="font-size:22px;font-weight:800">First-Trip Completion \u2013 '+(S.ds==='trim'?'Trim':'Lockout')+'</div><div class="sub">'+esc(parts.join(' \u00b7 '))+'</div>';
}
function drawBody(){
 var b=$('#body');
 if(!S.loaded){
  b.innerHTML='<div class="drop noprint"><h1>Load your tracker</h1><p style="color:var(--muted);margin:0 0 18px">Choose your BFS Trim and Lockout Tracker Excel file. It is read in this browser and never uploaded.</p><label class="btn primary" for="file" style="cursor:pointer">Choose Excel file</label></div>';
  return;
 }
 b.innerHTML=S.view==='dash'?renderDash():renderLog();
 $('#printHead').innerHTML=printHead();
}
function drawHeader(){
 var segs=document.querySelectorAll('#dsSeg button');
 segs.forEach(function(x){var k=x.getAttribute('data-v');x.classList.toggle('on',k===S.ds);x.disabled=!S.loaded||!S.data[k].length});
 document.querySelectorAll('#viewNav button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-v')===S.view)});
}
function draw(){drawHeader();drawFilters();drawBody()}

/* ---------- exports ---------- */
function stamp(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function exportXlsx(){
 if(!S.loaded){alert('Load your Excel file first.');return}
 var rows=sortedRows();
 var vis=COLS.filter(function(c){return S.cols[c[0]]});
 var log=rows.map(function(r){var o={};vis.forEach(function(c){var k=c[0],v;
  if(k==='builder')v=nm('builder',r.builder);else if(k==='community')v=nm('community',r.community);else if(k==='pm')v=nm('pm',r.pm);
  else if(k==='flags')v=r.flags.join(', ');else if(k==='date')v=r.ds;else v=r[k];o[c[1]]=v});return o});
 var base=filt(rowsNow(),false),st=stats(base);
 var A=[['First-Trip Completion \u2013 '+(S.ds==='trim'?'Trim':'Lockout')],[S.f.from+' to '+S.f.to],[],['First-trip rate',fmtPct(st.rate)],['Total jobs',st.n],['Complete',st.c],['Incomplete',st.i],[]];
 A.push(['By builder']);A.push(['Builder','Jobs','Complete','Incomplete','Rate']);
 var bg=groupBy(base,'builder');Object.keys(bg).sort(function(a,b){return bg[b].length-bg[a].length}).forEach(function(b){var s=stats(bg[b]);A.push([nm('builder',b),s.n,s.c,s.i,fmtPct(s.rate)])});
 A.push([]);A.push(['By project manager']);A.push(['PM','Jobs','Complete','Incomplete','Rate']);
 var pg=groupBy(base,'pm');Object.keys(pg).sort().forEach(function(p){var s=stats(pg[p]);A.push([p?nm('pm',p):'No PM name',s.n,s.c,s.i,fmtPct(s.rate)])});
 A.push([]);A.push(['Incomplete reasons']);A.push(['Reason','Jobs']);
 var rc={};base.filter(function(r){return r.result==='Incomplete'}).forEach(function(r){var k=r.reason||'(No reason entered)';rc[k]=(rc[k]||0)+1});
 Object.keys(rc).sort(function(a,b){return rc[b]-rc[a]}).forEach(function(k){A.push([k,rc[k]])});
 A.push([]);A.push(['By month']);A.push(['Month','Jobs','Complete','Incomplete','Rate']);
 var mg=groupBy(base,'ym');Object.keys(mg).sort().forEach(function(m){var s=stats(mg[m]);A.push([m,s.n,s.c,s.i,fmtPct(s.rate)])});
 var wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(A),'Summary');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(log),'Job log');
 XLSX.writeFile(wb,'First-Trip_'+(S.ds==='trim'?'Trim':'Lockout')+'_'+stamp()+'.xlsx');
}
var h2cPromise=null;
function loadH2C(){
 if(window.html2canvas)return Promise.resolve();
 if(h2cPromise)return h2cPromise;
 h2cPromise=new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=function(){h2cPromise=null;rej()};document.head.appendChild(s)});
 return h2cPromise;
}
function exportPng(){
 if(!S.loaded){alert('Load your Excel file first.');return}
 loadH2C().then(function(){
  return html2canvas($('#report'),{scale:2,backgroundColor:'#F4F6FA',useCORS:true});
 }).then(function(c){
  var a=document.createElement('a');a.download='First-Trip_'+(S.ds==='trim'?'Trim':'Lockout')+'_'+S.view+'_'+stamp()+'.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
 }).catch(function(){alert('Could not create the image. Check your internet connection and try again.')});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 var act=t.getAttribute('data-act'),v=t.getAttribute('data-v');
 if(act==='ds'){if(!S.loaded||S.ds===v)return;S.ds=v;resetFilters();S.showAllB=false;draw()}
 else if(act==='view'){if(S.view===v)return;S.view=v;drawHeader();drawBody()}
 else if(act==='clear'){resetFilters();drawFilters();drawBody()}
 else if(act==='quick'){S.quick[v]=!S.quick[v];S.limit=100;drawBody()}
 else if(act==='sort'){if(S.sort.key===v)S.sort.dir*=-1;else{S.sort.key=v;S.sort.dir=(v==='date'?-1:1)}drawBody()}
 else if(act==='more'){S.limit+=100;drawBody()}
 else if(act==='allb'){S.showAllB=!S.showAllB;drawBody()}
 else if(act==='xlsx')exportXlsx();
 else if(act==='png')exportPng();
 else if(act==='pdf'){if(!S.loaded){alert('Load your Excel file first.');return}window.print()}
});
var qTimer=null;
document.addEventListener('input',function(e){
 var t=e.target;if(t.getAttribute&&t.getAttribute('data-f')==='q'){S.f.q=t.value;clearTimeout(qTimer);qTimer=setTimeout(function(){S.limit=100;drawBody()},200)}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='file'){var fl=t.files&&t.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{loadWorkbook(rd.result)}catch(err){alert('Could not read that file: '+err.message)}};rd.readAsArrayBuffer(fl);t.value='';return}
 if(t.id==='goal'){var g=parseFloat(t.value);if(g>0&&g<=100){S.goal=g;try{localStorage.setItem('ftc_goal',String(g))}catch(x){}}drawBody();return}
 var f=t.getAttribute&&t.getAttribute('data-f');
 if(f&&f!=='q'){S.f[f]=t.value;S.limit=100;drawBody();return}
 var h=t.getAttribute&&t.getAttribute('data-hide');
 if(h){S.hide[h]=t.checked;drawFilters();drawBody();return}
 var c=t.getAttribute&&t.getAttribute('data-col');
 if(c){S.cols[c]=t.checked;S.colsOpen=true;drawBody()}
});
document.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('cols'))S.colsOpen=e.target.open},true);
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){
 e.preventDefault();var fl=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!fl)return;
 var rd=new FileReader();rd.onload=function(){try{loadWorkbook(rd.result)}catch(err){alert('Could not read that file: '+err.message)}};rd.readAsArrayBuffer(fl);
});
window.addEventListener('beforeprint',function(){$('#printHead').innerHTML=printHead()});
draw();
</script>
</body>
</html>
